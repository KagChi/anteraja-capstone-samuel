<!DOCTYPE html>
<html lang="id">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Peta Lokasi Pengiriman — Anteraja Instant</title>
    <style>
      :root {
        --brand: #e00065;
        --courier: #0284c7;
        --ink: #1f2937;
        --muted: #6b7280;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        height: 100%;
        margin: 0;
      }
      body {
        font-family: "Plus Jakarta Sans", system-ui, -apple-system, "Segoe UI",
          Roboto, sans-serif;
        display: flex;
        flex-direction: column;
        color: var(--ink);
      }
      header {
        display: flex;
        flex-wrap: wrap;
        align-items: baseline;
        gap: 12px;
        padding: 14px 20px;
        background: #0b0f19;
        color: #fff;
      }
      header h1 {
        margin: 0;
        font-size: 16px;
        font-weight: 700;
      }
      header p {
        margin: 0;
        font-size: 12px;
        color: #cbd5e1;
      }
      #legend {
        display: flex;
        gap: 14px;
        margin-left: auto;
        font-size: 12px;
        color: #e2e8f0;
      }
      #legend span {
        display: inline-flex;
        align-items: center;
        gap: 6px;
      }
      .dot {
        display: inline-block;
        width: 10px;
        height: 10px;
        border-radius: 9999px;
      }
      main {
        position: relative;
        flex: 1;
      }
      #map {
        position: absolute;
        inset: 0;
      }
      #status {
        position: absolute;
        top: 12px;
        left: 50%;
        z-index: 5;
        display: none;
        max-width: 90%;
        padding: 8px 14px;
        border: 1px solid #fcd34d;
        border-radius: 8px;
        background: #fef3c7;
        color: #92400e;
        font-size: 13px;
        transform: translateX(-50%);
      }
      #status.show {
        display: block;
      }
      #status.error {
        border-color: #fca5a5;
        background: #fee2e2;
        color: #991b1b;
      }
      .info {
        min-width: 190px;
        font-family: system-ui, sans-serif;
      }
      .info__tracking {
        font-size: 13px;
        font-weight: 700;
      }
      .info__role {
        margin: 2px 0 6px;
        color: var(--muted);
        font-size: 11px;
      }
      .info__detail {
        margin-top: 4px;
        color: var(--muted);
        font-size: 11px;
      }
    </style>
  </head>
  <body>
    <header>
      <h1>Peta Lokasi Pengiriman</h1>
      <p>Anteraja Instant — Day 19 · Google Maps</p>
      <div id="legend">
        <span><i class="dot" style="background: #e00065"></i>Shipment (tujuan)</span>
        <span><i class="dot" style="background: #0284c7"></i>Kurir</span>
        <span><i class="dot" style="background: #7c3aed"></i>Alamat (geocoded)</span>
      </div>
    </header>
    <main>
      <div id="status" role="status"></div>
      <div id="map"></div>
    </main>

    <script>
      // ---------------------------------------------------------------------
      // Google Maps API key
      //
      // Ganti placeholder ini dengan API key Google Maps milikmu yang SUDAH
      // DIBATASI (restricted):
      //   - Application restriction : HTTP referrers -> http://localhost/* ,
      //                               http://127.0.0.1/*
      //   - API restriction         : Maps JavaScript API
      // Nilai di sini sengaja dibiarkan sebagai placeholder supaya tidak ada
      // key tanpa pembatasan yang ter-commit. Langkah lengkap ada di README.md.
      // ---------------------------------------------------------------------
      const GOOGLE_MAPS_API_KEY = "AIzaSyB_ME6mpOKpyOhnhYLFYN9S4kvnjBLvssU";

      // Area layanan: Jakarta, dipakai sebagai titik tengah peta.
      const JAKARTA = { lat: -6.229, lng: 106.854 };
      const ZOOM = 12;

      // Data contoh: 15 pengiriman dari docs/data/shipments-couriers-coordinates.csv
      // (tracking number, titik tujuan, posisi kurir terakhir, status).
      const shipments = [
        { tracking: "AJ2509000001", status: "delivered", destinationLat: -6.175392, destinationLng: 106.827153, courierLat: -6.1754, courierLng: 106.82716 },
        { tracking: "AJ2509000002", status: "delivered", destinationLat: -6.208763, destinationLng: 106.821247, courierLat: -6.20877, courierLng: 106.821255 },
        { tracking: "AJ2509000003", status: "delivered", destinationLat: -6.195, destinationLng: 106.832, courierLat: -6.1952, courierLng: 106.8323 },
        { tracking: "AJ2509000004", status: "delivered", destinationLat: -6.26, destinationLng: 106.813, courierLat: -6.2605, courierLng: 106.8136 },
        { tracking: "AJ2509000005", status: "in_transit", destinationLat: -6.229, destinationLng: 106.854, courierLat: -6.236, courierLng: 106.86 },
        { tracking: "AJ2509000006", status: "delivered", destinationLat: -6.225, destinationLng: 106.799, courierLat: -6.23, courierLng: 106.799 },
        { tracking: "AJ2509000007", status: "failed", destinationLat: -6.236, destinationLng: 106.829, courierLat: -6.2361, courierLng: 106.8291 },
        { tracking: "AJ2509000008", status: "pending", destinationLat: -6.109, destinationLng: 106.742, courierLat: -6.1089, courierLng: 106.7421 },
        { tracking: "AJ2509000009", status: "delivered", destinationLat: -6.157, destinationLng: 106.906, courierLat: -6.1577, courierLng: 106.9068 },
        { tracking: "AJ2509000010", status: "delivered", destinationLat: -6.183, destinationLng: 106.87, courierLat: -6.18305, courierLng: 106.87005 },
        { tracking: "AJ2509000011", status: "pending", destinationLat: -6.175392, destinationLng: 106.827153, courierLat: -6.1755, courierLng: 106.8273 },
        { tracking: "AJ2509000012", status: "in_transit", destinationLat: -6.195, destinationLng: 106.832, courierLat: -6.213, courierLng: 106.845 },
        { tracking: "AJ2509000013", status: "failed", destinationLat: -6.26, destinationLng: 106.813, courierLat: -6.2599, courierLng: 106.8131 },
        { tracking: "AJ2509000014", status: "delivered", destinationLat: -6.208763, destinationLng: 106.821247, courierLat: -6.21, courierLng: 106.823 },
        { tracking: "AJ2509000015", status: "delivered", destinationLat: -6.225, destinationLng: 106.799, courierLat: -6.2251, courierLng: 106.7991 },
      ];

      // Bonus: satu data yang hanya punya alamat (tanpa lat/lng). Alamat ini
      // di-geocode menjadi koordinat lalu ditambahkan sebagai marker.
      const addressOnlyRecords = [
        {
          tracking: "AJ2509000100",
          status: "pending",
          address:
            "Jl. Prof. Dr. Satrio No. 18, Kuningan, Jakarta Selatan, DKI Jakarta",
        },
      ];

      const STATUS_LABELS = {
        delivered: "Terkirim",
        in_transit: "Dalam perjalanan",
        pending: "Menunggu",
        failed: "Gagal",
      };

      const MARKER_COLORS = {
        shipment: "#e00065",
        courier: "#0284c7",
        geocoded: "#7c3aed",
      };

      /** @type {google.maps.Map | undefined} */
      let map;
      /** @type {google.maps.InfoWindow | undefined} */
      let infoWindow;

      const statusEl = document.getElementById("status");

      function showStatus(message, isError = false) {
        statusEl.textContent = message;
        statusEl.classList.toggle("error", isError);
        statusEl.classList.add("show");
      }

      // Dipanggil lewat parameter "callback" pada URL Google Maps JS API
      // setelah library selesai dimuat.
      function initMap() {
        map = new google.maps.Map(document.getElementById("map"), {
          center: JAKARTA,
          zoom: ZOOM,
          mapTypeControl: false,
          streetViewControl: false,
        });
        infoWindow = new google.maps.InfoWindow();
        addShipmentMarkers();
        geocodeAddressOnlyRecords();
      }

      // Ikon marker berbentuk pin, dibuat dari SVG inline agar tidak perlu
      // gambar eksternal. Warna pin membedakan shipment dan kurir.
      function markerIcon(kind) {
        const color = MARKER_COLORS[kind];
        const svg =
          '<svg xmlns="http://www.w3.org/2000/svg" width="26" height="38" viewBox="0 0 26 38">' +
          '<path d="M13 0C5.82 0 0 5.82 0 13c0 9.2 13 25 13 25s13-15.8 13-25C26 5.82 20.18 0 13 0z" fill="' +
          color +
          '"/><circle cx="13" cy="13" r="5" fill="#ffffff"/></svg>';

        return {
          url: "data:image/svg+xml;charset=UTF-8," + encodeURIComponent(svg),
          scaledSize: new google.maps.Size(26, 38),
          anchor: new google.maps.Point(13, 38),
        };
      }

      // Isi info window: tracking number, status, dan peran marker.
      function infoContent({ tracking, status, role, detail }) {
        const label = STATUS_LABELS[status] || status;
        return (
          '<div class="info">' +
          `<div class="info__tracking">${tracking}</div>` +
          `<div class="info__role">${role}</div>` +
          `<div>Status: <strong>${label}</strong></div>` +
          (detail ? `<div class="info__detail">${detail}</div>` : "") +
          "</div>"
        );
      }

      // Buat satu marker dan pasang info window pada klik. Semua marker berbagi
      // satu info window agar hanya satu yang terbuka pada satu waktu.
      function addMarker(position, kind, content) {
        const marker = new google.maps.Marker({
          position,
          map,
          icon: markerIcon(kind),
          title: content.tracking,
        });

        marker.addListener("click", () => {
          infoWindow.setContent(infoContent(content));
          infoWindow.open({ map, anchor: marker });
        });

        return marker;
      }

      // Loop data shipment: satu marker di titik tujuan dan satu di posisi kurir.
      function addShipmentMarkers() {
        const bounds = new google.maps.LatLngBounds();

        shipments.forEach((s) => {
          const destination = { lat: s.destinationLat, lng: s.destinationLng };
          const courier = { lat: s.courierLat, lng: s.courierLng };

          addMarker(destination, "shipment", {
            tracking: s.tracking,
            status: s.status,
            role: "Shipment — titik tujuan",
            detail: `Tujuan: ${s.destinationLat.toFixed(5)}, ${s.destinationLng.toFixed(5)}`,
          });

          addMarker(courier, "courier", {
            tracking: s.tracking,
            status: s.status,
            role: "Kurir",
            detail: `Posisi kurir: ${s.courierLat.toFixed(5)}, ${s.courierLng.toFixed(5)}`,
          });

          bounds.extend(destination);
          bounds.extend(courier);
        });

        map.fitBounds(bounds);
      }

      // Bonus Day 19: konversi alamat menjadi koordinat lewat layanan Geocoding
      // (tersedia melalui Maps JavaScript API). Kalau gagal, hanya dicatat di
      // console sehingga marker dari lat/lng tetap tampil.
      function geocodeAddressOnlyRecords() {
        const geocoder = new google.maps.Geocoder();

        addressOnlyRecords.forEach((record) => {
          geocoder.geocode({ address: record.address }, (results, status) => {
            if (status !== "OK" || !results || !results[0]) {
              console.warn(
                `Geocoding gagal untuk ${record.tracking} (${status}): ${record.address}`,
              );
              return;
            }

            const result = results[0];
            addMarker(result.geometry.location, "geocoded", {
              tracking: record.tracking,
              status: record.status,
              role: "Shipment — hasil geocoding alamat",
              detail: result.formatted_address,
            });
          });
        });
      }

      // Google Maps memanggil ini ketika API key ditolak (mis. referrer tidak
      // cocok atau API belum diaktifkan).
      window.gm_authFailure = () => {
        showStatus(
          "Google Maps menolak API key ini. Periksa pembatasan HTTP referrer dan API di Google Cloud Console.",
          true,
        );
      };

      function loadGoogleMaps() {
        if (GOOGLE_MAPS_API_KEY === "YOUR_API_KEY") {
          showStatus(
            "Isi GOOGLE_MAPS_API_KEY di shipment-map.html dengan API key Google Maps yang sudah dibatasi. Lihat README.md.",
            true,
          );
        }

        const script = document.createElement("script");
        script.async = true;
        script.src =
          "https://maps.googleapis.com/maps/api/js" +
          `?key=${encodeURIComponent(GOOGLE_MAPS_API_KEY)}` +
          "&callback=initMap&loading=async";
        script.onerror = () =>
          showStatus(
            "Gagal memuat Google Maps JavaScript API. Periksa koneksi jaringan.",
            true,
          );
        document.head.appendChild(script);
      }

      loadGoogleMaps();
    </script>
  </body>
</html>
