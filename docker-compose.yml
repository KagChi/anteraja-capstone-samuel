services:
  postgis:
    image: postgis/postgis:16-3.4
    container_name: anteraja-postgis
    environment:
      POSTGRES_DB: anteraja
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "55432:5432"
    volumes:
      - postgis-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d anteraja"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Optional: only needed when the Redis cache/queue/session drivers are enabled.
  redis:
    image: redis:7-alpine
    container_name: anteraja-redis
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # The app itself, served by FrankenPHP/Octane. Opt-in so the plain
  # `docker compose up -d` keeps starting only the datastores:
  #   docker compose --profile app up -d --build
  #   docker compose --profile app run --rm app php artisan migrate --seed --force
  app:
    profiles: ["app"]
    build:
      context: .
    container_name: anteraja-app
    depends_on:
      postgis:
        condition: service_healthy
    env_file:
      - .env
    environment:
      # Inside the Compose network PostGIS is a service, not localhost:55432.
      DB_HOST: postgis
      DB_PORT: "5432"
      DB_DATABASE: anteraja
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      DB_SSLMODE: prefer
    ports:
      - "8080:8080"

volumes:
  postgis-data:
  redis-data:
