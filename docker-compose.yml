services:
  postgis:
    image: postgis/postgis:16-3.4
    container_name: anteraja-postgis
    environment:
      POSTGRES_DB: anteraja
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "55432:5432"
    volumes:
      - postgis-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d anteraja"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Optional: only needed when the Redis cache/queue/session drivers are enabled.
  redis:
    image: redis:7-alpine
    container_name: anteraja-redis
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgis-data:
  redis-data:
